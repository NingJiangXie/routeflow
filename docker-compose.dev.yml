version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: routeflow-api-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - JSON_LOGS=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
      - RATE_LIMIT_DEFAULT=100/minute
      - RATE_LIMIT_CHAT=20/minute
      - RATE_LIMIT_CODE_GEN=10/minute
    volumes:
      - ./api:/app/api:ro
    command: python -m uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - routeflow-dev

networks:
  routeflow-dev:
    driver: bridge
